name: ZigZag Step 9 - Aligned Swing Fibonacci Statistics

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_zigzag_step9_aligned_fibo_stats.py"
      - "results/zigzag_step7/swings_with_previous_fibo.csv"
      - "results/zigzag_step8/swings_lwma_trend_aligned.csv"

permissions:
  contents: write

jobs:
  step9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Run Step 9
        run: python scripts/export_zigzag_step9_aligned_fibo_stats.py

      - name: Commit Step 9 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/zigzag_step9
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Step 9 aligned swing Fibonacci statistics"
          git pull --rebase origin main
          git push origin HEAD:main

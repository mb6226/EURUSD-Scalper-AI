name: Step 14 - Price Action Event Study

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_step14_price_action_event_study.py"
      - "results/step12_economic_filtered_stats/step12_162_signal_list.csv"
      - "results/zigzag_step7/swings_with_previous_fibo.csv"
      - "data/eurusd/EURUSD_1m.csv"
      - ".github/workflows/step14-price-action-event-study.yml"

permissions:
  contents: write

jobs:
  step14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy

      - name: Run Step 14 event study
        run: python scripts/export_step14_price_action_event_study.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/step14_price_action_event_study
          if git diff --cached --quiet; then
            echo "No Step 14 result changes to commit."
          else
            git commit -m "Generate Step 14 price action event study"
            git push
          fi

name: Step 13 - Price Action Features

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_step13_price_action_features.py"
      - "results/step12_economic_filtered_stats/step12_162_signal_list.csv"
      - "results/zigzag_step7/swings_with_previous_fibo.csv"
      - "data/eurusd/EURUSD_1m.csv"
      - ".github/workflows/step13-price-action-features.yml"

permissions:
  contents: write

jobs:
  price-action-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy

      - name: Build Step 13 features
        run: python scripts/export_step13_price_action_features.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/step13_price_action
          if git diff --cached --quiet; then
            echo "No Step 13 result changes to commit."
          else
            git commit -m "Generate Step 13 price action feature results"
            git push
          fi

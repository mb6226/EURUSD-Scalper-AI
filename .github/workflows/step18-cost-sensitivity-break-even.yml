name: Step 18 - Cost Sensitivity + Break-even

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_step18_cost_sensitivity_break_even.py"
      - "results/step17_cost_aware/step17_cost_sensitivity.csv"
      - ".github/workflows/step18-cost-sensitivity-break-even.yml"

permissions:
  contents: write

jobs:
  step18:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Run Step 18 cost sensitivity + break-even
        run: python scripts/export_step18_cost_sensitivity_break_even.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/step18_cost_sensitivity
          if git diff --cached --quiet; then
            echo "No Step 18 result changes to commit."
          else
            git commit -m "Generate Step 18 cost sensitivity and break-even results"
            git push
          fi

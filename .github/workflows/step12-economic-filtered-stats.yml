name: Step 12 - Economic Filtered Signal Statistics

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_step12_economic_filtered_signal_stats.py"
      - "results/step11_economic_regime/step11_filtered_signals.csv"

permissions:
  contents: write

jobs:
  step12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Run Step 12 statistics
        run: python scripts/export_step12_economic_filtered_signal_stats.py
      - name: Commit Step 12 reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/step12_economic_filtered_stats
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Step 12 economic-filtered signal statistics"
          git pull --rebase origin main
          git push origin HEAD:main

name: Step 15 - Backtest Entry Models A-E

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/export_step15_backtest_entry_models.py"
      - "results/step14_price_action_event_study/step14_formal_entry_events.csv"
      - "data/eurusd/EURUSD_1m.csv"
      - ".github/workflows/step15-backtest-entry-models.yml"

permissions:
  contents: write

jobs:
  step15:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pandas numpy
      - name: Run Step 15 backtest
        run: python scripts/export_step15_backtest_entry_models.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/step15_backtest
          if git diff --cached --quiet; then
            echo "No Step 15 result changes to commit."
          else
            git commit -m "Generate Step 15 entry model backtests"
            git push
          fi

name: Download EURUSD Historical Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2025-09-08'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2026-09-08'

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install histdata pandas pyarrow

      - name: Download and build EURUSD 1m + 5m OHLCV
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          cat > build_data.py <<'PY'
          import os, zipfile, glob, subprocess
          from pathlib import Path
          from datetime import date, datetime
          import pandas as pd
          from histdata import download_hist_data
          from histdata.api import Platform, TimeFrame

          start = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['END_DATE'])
          raw = Path('raw')
          out = Path('data/eurusd')
          raw.mkdir(exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          # HistData serves past years as a yearly M1 archive and the current
          # year month-by-month. Download only the years/months intersecting
          # the requested range, then filter exactly to the requested dates.
          years = range(start.year, end.year + 1)
          for year in years:
              if year < end.year:
                  target = raw / f'{year}'
                  target.mkdir(exist_ok=True)
                  print(f'Downloading EURUSD M1 {year}...')
                  download_hist_data(
                      year=str(year), month=None, pair='eurusd',
                      platform=Platform.GENERIC_ASCII,
                      time_frame=TimeFrame.ONE_MINUTE,
                      output_directory=str(target), verbose=True,
                  )
              else:
                  first_month = start.month if year == start.year else 1
                  last_month = end.month
                  for month in range(first_month, last_month + 1):
                      target = raw / f'{year}'
                      target.mkdir(exist_ok=True)
                      print(f'Downloading EURUSD M1 {year}-{month:02d}...')
                      download_hist_data(
                          year=str(year), month=str(month), pair='eurusd',
                          platform=Platform.GENERIC_ASCII,
                          time_frame=TimeFrame.ONE_MINUTE,
                          output_directory=str(target), verbose=True,
                      )

          zips = sorted(glob.glob('raw/**/*.zip', recursive=True))
          if not zips:
              raise RuntimeError('No HistData archives were downloaded.')

          frames = []
          for z in zips:
              with zipfile.ZipFile(z) as zz:
                  csvs = [n for n in zz.namelist() if n.lower().endswith('.csv')]
                  if not csvs:
                      continue
                  with zz.open(csvs[0]) as f:
                      df = pd.read_csv(
                          f, sep=';', header=None,
                          names=['timestamp','open','high','low','close','volume'],
                      )
                  frames.append(df)

          if not frames:
              raise RuntimeError('No CSV data found inside downloaded archives.')

          df = pd.concat(frames, ignore_index=True)
          df['timestamp'] = pd.to_datetime(df['timestamp'], format='%Y%m%d %H%M%S', errors='coerce')
          for c in ['open','high','low','close','volume']:
              df[c] = pd.to_numeric(df[c], errors='coerce')
          df = df.dropna(subset=['timestamp','open','high','low','close'])
          df = df.drop_duplicates('timestamp').sort_values('timestamp')

          # HistData timestamps are EST without DST adjustments. Keep the raw
          # source clock explicit rather than silently converting it.
          start_ts = pd.Timestamp(start)
          end_ts = pd.Timestamp(end) + pd.Timedelta(days=1) - pd.Timedelta(minutes=1)
          df = df[(df['timestamp'] >= start_ts) & (df['timestamp'] <= end_ts)].copy()
          df['volume'] = df['volume'].fillna(0).astype('int64')

          one_min = df[['timestamp','open','high','low','close','volume']].copy()
          five_min = (
              one_min.set_index('timestamp')
              .resample('5min', label='left', closed='left')
              .agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'})
              .dropna(subset=['open','high','low','close'])
              .reset_index()
          )
          five_min['volume'] = five_min['volume'].astype('int64')

          one_min.to_parquet(out / 'EURUSD_1m.parquet', index=False)
          five_min.to_parquet(out / 'EURUSD_5m.parquet', index=False)
          one_min.to_csv(out / 'EURUSD_1m.csv', index=False)
          five_min.to_csv(out / 'EURUSD_5m.csv', index=False)

          manifest = out / 'MANIFEST.txt'
          manifest.write_text(
              f'EURUSD historical OHLCV\n'
              f'Source: HistData.com Generic ASCII M1\n'
              f'Range requested: {start} to {end}\n'
              f'1m rows: {len(one_min):,}\n'
              f'5m rows: {len(five_min):,}\n'
              f'Timestamp source clock: EST without DST adjustments\n'
              f'5m bars: aggregated from canonical 1m bars\n',
              encoding='utf-8',
          )

          print(one_min.head())
          print(one_min.tail())
          print(f'1m rows: {len(one_min):,}')
          print(f'5m rows: {len(five_min):,}')
          print('Output:', out.resolve())
          PY
          python build_data.py

      - name: Validate dataset
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for p in [Path('data/eurusd/EURUSD_1m.parquet'), Path('data/eurusd/EURUSD_5m.parquet')]:
              df = pd.read_parquet(p)
              assert not df.empty, f'{p} is empty'
              assert df[['open','high','low','close']].notna().all().all(), f'NaN OHLC in {p}'
              assert (df['high'] >= df[['open','close','low']].max(axis=1)).all(), f'Invalid highs in {p}'
              assert (df['low'] <= df[['open','close','high']].min(axis=1)).all(), f'Invalid lows in {p}'
              assert df['timestamp'].is_monotonic_increasing, f'Timestamps not sorted in {p}'
              assert not df['timestamp'].duplicated().any(), f'Duplicate timestamps in {p}'
              print(p, len(df), df.timestamp.min(), df.timestamp.max())
          PY

      - name: Package data
        run: tar -czf EURUSD_1Y_OHLCV.tar.gz data/eurusd

      - name: Upload EURUSD dataset artifact
        uses: actions/upload-artifact@v4
        with:
          name: EURUSD-1Y-OHLCV-1m-5m
          path: EURUSD_1Y_OHLCV.tar.gz
          retention-days: 14
          compression-level: 0

name: Download EURUSD Historical Data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD)'
        required: false
        default: '2025-09-08'
      end_date:
        description: 'End date (YYYY-MM-DD)'
        required: false
        default: '2026-09-08'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install histdata pandas pyarrow

      - name: Download and build EURUSD 1m + 5m OHLCV
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          cat > build_data.py <<'PY'
          import os, zipfile, glob
          from pathlib import Path
          from datetime import date
          import pandas as pd
          from histdata import download_hist_data
          from histdata.api import Platform, TimeFrame

          start = date.fromisoformat(os.environ['START_DATE'])
          end = date.fromisoformat(os.environ['END_DATE'])
          raw = Path('raw')
          out = Path('data/eurusd')
          raw.mkdir(exist_ok=True)
          out.mkdir(parents=True, exist_ok=True)

          for year in range(start.year, end.year + 1):
              first_month = start.month if year == start.year else 1
              last_month = end.month if year == end.year else 12
              for month in range(first_month, last_month + 1):
                  target = raw / str(year)
                  target.mkdir(exist_ok=True)
                  print(f'Downloading EURUSD M1 {year}-{month:02d}...')
                  download_hist_data(
                      year=str(year), month=str(month), pair='eurusd',
                      platform=Platform.GENERIC_ASCII,
                      time_frame=TimeFrame.ONE_MINUTE,
                      output_directory=str(target), verbose=True,
                  )

          zips = sorted(glob.glob('raw/**/*.zip', recursive=True))
          if not zips:
              raise RuntimeError('No HistData archives were downloaded.')

          frames = []
          for z in zips:
              with zipfile.ZipFile(z) as zz:
                  csvs = [n for n in zz.namelist() if n.lower().endswith('.csv')]
                  for csv_name in csvs:
                      with zz.open(csv_name) as f:
                          frames.append(pd.read_csv(
                              f, sep=';', header=None,
                              names=['timestamp','open','high','low','close','volume']
                          ))

          df = pd.concat(frames, ignore_index=True)
          df['timestamp'] = pd.to_datetime(df['timestamp'], format='%Y%m%d %H%M%S', errors='coerce')
          for c in ['open','high','low','close','volume']:
              df[c] = pd.to_numeric(df[c], errors='coerce')
          df = df.dropna(subset=['timestamp','open','high','low','close'])
          df = df.drop_duplicates('timestamp').sort_values('timestamp')

          start_ts = pd.Timestamp(start)
          end_ts = pd.Timestamp(end) + pd.Timedelta(days=1) - pd.Timedelta(minutes=1)
          df = df[(df['timestamp'] >= start_ts) & (df['timestamp'] <= end_ts)].copy()
          df['volume'] = df['volume'].fillna(0).astype('int64')

          one_min = df[['timestamp','open','high','low','close','volume']].copy()
          five_min = (
              one_min.set_index('timestamp')
              .resample('5min', label='left', closed='left')
              .agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'})
              .dropna(subset=['open','high','low','close'])
              .reset_index()
          )
          five_min['volume'] = five_min['volume'].astype('int64')

          one_min.to_parquet(out / 'EURUSD_1m.parquet', index=False)
          five_min.to_parquet(out / 'EURUSD_5m.parquet', index=False)
          one_min.to_csv(out / 'EURUSD_1m.csv', index=False)
          five_min.to_csv(out / 'EURUSD_5m.csv', index=False)

          (out / 'MANIFEST.txt').write_text(
              f'EURUSD historical OHLCV\n'
              f'Source: HistData.com Generic ASCII M1\n'
              f'Requested range: {start} to {end}\n'
              f'1m rows: {len(one_min):,}\n'
              f'5m rows: {len(five_min):,}\n'
              f'Volume: source tick volume, not centralized FX volume\n'
              f'5m bars are aggregated from canonical 1m bars\n',
              encoding='utf-8'
          )
          PY
          python build_data.py

      - name: Validate dataset
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          for p in [Path('data/eurusd/EURUSD_1m.parquet'), Path('data/eurusd/EURUSD_5m.parquet')]:
              df = pd.read_parquet(p)
              assert not df.empty
              assert df['timestamp'].is_monotonic_increasing
              assert not df['timestamp'].duplicated().any()
              assert (df['high'] >= df[['open','close','low']].max(axis=1)).all()
              assert (df['low'] <= df[['open','close','high']].min(axis=1)).all()
              print(f'{p}: {len(df):,} rows, {df.timestamp.min()} -> {df.timestamp.max()}')
          PY

      - name: Commit data into repository
        run: |
          rm -rf raw build_data.py
          git add data/eurusd/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m "Add EURUSD 1m and 5m historical data"
            git push origin HEAD:main
          fi

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: EURUSD-1Y-OHLCV-1m-5m
          path: data/eurusd/
          retention-days: 14
          compression-level: 0

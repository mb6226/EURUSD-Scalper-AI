name: ZigZag Step 4 - Robustness Sensitivity

on:
  workflow_dispatch:
  push:
    paths:
      - 'results/zigzag_quarterly/quarter_top20.csv'
      - 'results/zigzag_quarterly/quarter_stability.csv'
      - 'scripts/zigzag_robustness.py'
      - 'scripts/evaluate_zigzag_temporal.py'
      - '.github/workflows/zigzag-robustness.yml'

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numba

      - name: Validate Step 3 input
        run: |
          test -s results/zigzag_quarterly/quarter_top20.csv
          test -s results/zigzag_quarterly/quarter_stability.csv
          python - <<'PY'
          import pandas as pd
          p = pd.read_csv('results/zigzag_quarterly/quarter_top20.csv')
          assert len(p) >= 5
          assert {'depth','deviation','backstep'}.issubset(p.columns)
          print(p.head(20).to_string(index=False))
          PY

      - name: Run robustness and sensitivity analysis
        run: |
          python scripts/zigzag_robustness.py \
            --input data/eurusd/EURUSD_1m.parquet \
            --step3 results/zigzag_quarterly/quarter_top20.csv \
            --output-dir results/zigzag_robustness \
            --point 0.00001

      - name: Validate Step 4 results
        run: |
          test -s results/zigzag_robustness/robustness_candidates.csv
          test -s results/zigzag_robustness/robustness_all_results.csv
          test -s results/zigzag_robustness/robustness_top50.csv
          test -s results/zigzag_robustness/sensitivity_depth.csv
          test -s results/zigzag_robustness/sensitivity_deviation.csv
          test -s results/zigzag_robustness/sensitivity_backstep.csv
          test -s results/zigzag_robustness/robust_parameter_plateau.csv
          python - <<'PY'
          import pandas as pd
          c = pd.read_csv('results/zigzag_robustness/robustness_candidates.csv')
          r = pd.read_csv('results/zigzag_robustness/robustness_all_results.csv')
          assert len(c) == len(r)
          assert len(c) >= 400
          assert r.robustness_score.between(0, 1).all()
          assert r.depth.nunique() >= 15
          print('Candidates:', len(c))
          print('Depth values:', sorted(c.depth.unique()))
          print(r.head(20).to_string(index=False))
          PY

      - name: Commit Step 4 results
        run: |
          git add results/zigzag_robustness/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No Step 4 result changes to commit.'
          else
            git commit -m 'Add ZigZag robustness sensitivity results'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload Step 4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EURUSD-M1-ZigZag-Robustness-Sensitivity
          path: results/zigzag_robustness/
          retention-days: 30
